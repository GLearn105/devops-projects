name: CI Pipeline — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd phase3/flask-app
          pip install -r requirements.txt

      - name: Run tests
        run: |
          cd phase3/flask-app
          python -m pytest test_app.py -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test              # job ini hanya jalan kalau test LULUS

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          cd phase3/flask-app
          docker build -t flask-devops:${{ github.sha }} .
          echo "Image berhasil dibangun dengan tag: ${{ github.sha }}"

      - name: Verify image exists
        run: docker images flask-devops
      - name: Pakai secret
        run: echo "Secret tersedia tapi tidak tampil di log"
        env:
          API_KEY: ${{ secrets.MY_SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
