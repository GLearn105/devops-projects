name: CD Pipeline — Build, Push & Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install & Test
        run: |
          cd phase3/flask-app
          pip install -r requirements.txt
          python -m pytest test_app.py -v

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: ./phase3/flask-app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops:${{ github.sha }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy simulation
        run: |
          echo "==============================="
          echo "✅ Image berhasil di-push ke Docker Hub"
          echo "📦 Image: ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops:latest"
          echo "🔖 Commit: ${{ github.sha }}"
          echo "👤 Di-deploy oleh: ${{ github.actor }}"
          echo "📅 Waktu: $(date)"
          echo "==============================="
          echo "Di Phase 5 (AWS), step ini akan SSH ke EC2 dan jalankan docker compose pull && docker compose up -d"
